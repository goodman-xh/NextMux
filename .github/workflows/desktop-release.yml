name: Desktop release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Build unsigned qualification artifacts, or roll the signed update feed back.
        required: true
        type: choice
        default: build
        options: [build, rollback]
      rollback_tag:
        description: Existing signed tag to promote when operation=rollback (for example v0.1.0).
        required: false
        type: string

concurrency:
  group: nextmux-desktop-production-feed
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-targets:
    if: github.event_name == 'push' || inputs.operation == 'build'
    runs-on: ubuntu-24.04
    outputs:
      windows: ${{ steps.matrix.outputs.windows }}
      macos: ${{ steps.matrix.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Validate and publish the native target matrix
        id: matrix
        run: node scripts/desktop-release-targets.mjs --github-output

  quality-gate:
    if: github.event_name == 'push' || inputs.operation == 'build'
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Record the quality-gated commit
        id: commit
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Run the complete workspace quality gate
        run: pnpm check
      - name: Run the model-runtime release gate explicitly
        run: pnpm --filter @nextmux/model-runtime test

  windows:
    if: github.event_name == 'push' || inputs.operation == 'build'
    needs: [quality-gate, release-targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-targets.outputs.windows) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}
      NEXTMUX_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      NEXTMUX_RELEASE_EVIDENCE: apps/desktop/release-evidence/windows-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Initialize runner evidence and prove the gated commit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:NEXTMUX_RELEASE_EVIDENCE | Out-Null
          if ((git rev-parse HEAD) -ne '${{ needs.quality-gate.outputs.commit }}') {
            throw 'Native Windows runner is not building the quality-gated commit.'
          }
          node scripts/write-desktop-release-evidence.mjs --output "$env:NEXTMUX_RELEASE_EVIDENCE/runner.json" --release-dir apps/desktop/release --platform windows --arch ${{ matrix.arch }}
      - name: Enable the pinned package manager
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Verify signed release environment
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-desktop-release-environment.mjs --platform win32 --arch ${{ matrix.arch }} --signed true --tag ${{ github.ref_name }}
      - name: Verify unsigned qualification environment
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/verify-desktop-release-environment.mjs --platform win32 --arch ${{ matrix.arch }} --signed false
      - run: pnpm install --frozen-lockfile
      - name: Run native terminal and release regressions
        run: |
          pnpm --filter @nextmux/agent-runtime test
          pnpm --filter @nextmux/theia-extension test
          pnpm --filter @nextmux/desktop test
      - name: Build production desktop application bundle
        run: pnpm desktop:build:release
      - name: Verify source native ABI, architecture, tools, keytar, and FFmpeg
        shell: pwsh
        run: |
          node scripts/capture-desktop-release-command.mjs --stdout "$env:NEXTMUX_RELEASE_EVIDENCE/source-terminal-verifier.stdout.log" --stderr "$env:NEXTMUX_RELEASE_EVIDENCE/source-terminal-verifier.stderr.log" -- node scripts/verify-terminal-native-artifact.mjs --bundle --output "$env:NEXTMUX_RELEASE_EVIDENCE/source-terminal-verifier.json"
          node scripts/capture-desktop-release-command.mjs --stdout "$env:NEXTMUX_RELEASE_EVIDENCE/source-desktop-verifier.stdout.log" --stderr "$env:NEXTMUX_RELEASE_EVIDENCE/source-desktop-verifier.stderr.log" -- node scripts/verify-desktop-native-artifacts.mjs --output "$env:NEXTMUX_RELEASE_EVIDENCE/source-desktop-verifier.json"
      - name: Run real source desktop product E2E
        shell: pwsh
        run: |
          $env:npm_lifecycle_event = 'test:e2e:desktop'
          node scripts/capture-desktop-release-command.mjs --stdout "$env:NEXTMUX_RELEASE_EVIDENCE/source-e2e.stdout.log" --stderr "$env:NEXTMUX_RELEASE_EVIDENCE/source-e2e.stderr.log" -- node scripts/desktop-terminal-ci-e2e.mjs
      - name: Build native Windows artifacts without rebuilding the bundle
        run: pnpm --filter @nextmux/desktop run dist:win:${{ matrix.arch }}:prepared
      - name: Locate packaged resources, portable EXE, and NSIS installer
        id: packaged
        shell: pwsh
        run: |
          $appAsar = Get-ChildItem apps/desktop/release -Recurse -File -Filter app.asar | Select-Object -First 1
          $portable = Get-ChildItem apps/desktop/release -File -Filter 'NextMux-*-portable.exe' | Select-Object -First 1
          $installer = Get-ChildItem apps/desktop/release -File -Filter 'NextMux-*-setup.exe' | Select-Object -First 1
          if (-not $appAsar) { throw 'Packaged app.asar was not found.' }
          if (-not $portable) { throw 'The real NSIS portable EXE was not found.' }
          if (-not $installer) { throw 'The real NSIS installer EXE was not found.' }
          "resources=$($appAsar.DirectoryName)" >> $env:GITHUB_OUTPUT
          "portable=$($portable.FullName)" >> $env:GITHUB_OUTPUT
          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
      - name: Verify final packaged native artifacts
        shell: pwsh
        run: |
          node scripts/capture-desktop-release-command.mjs --stdout "$env:NEXTMUX_RELEASE_EVIDENCE/packaged-terminal-verifier.stdout.log" --stderr "$env:NEXTMUX_RELEASE_EVIDENCE/packaged-terminal-verifier.stderr.log" -- node scripts/verify-terminal-native-artifact.mjs --packaged "${{ steps.packaged.outputs.resources }}" --output "$env:NEXTMUX_RELEASE_EVIDENCE/packaged-terminal-verifier.json"
          node scripts/capture-desktop-release-command.mjs --stdout "$env:NEXTMUX_RELEASE_EVIDENCE/packaged-desktop-verifier.stdout.log" --stderr "$env:NEXTMUX_RELEASE_EVIDENCE/packaged-desktop-verifier.stderr.log" -- node scripts/verify-desktop-native-artifacts.mjs --packaged "${{ steps.packaged.outputs.resources }}" --output "$env:NEXTMUX_RELEASE_EVIDENCE/packaged-desktop-verifier.json"
      - name: Install the NSIS artifact for installed-product E2E
        id: installed
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'nextmux-installed-${{ matrix.arch }}'
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          & '${{ steps.packaged.outputs.installer }}' /S "/D=$installRoot"
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer failed with exit code $LASTEXITCODE." }
          $installed = Get-ChildItem -LiteralPath $installRoot -Recurse -File -Filter NextMux.exe | Select-Object -First 1
          if (-not $installed) { throw 'NSIS installation did not produce NextMux.exe.' }
          $installedResources = Join-Path $installed.DirectoryName 'resources'
          if (-not (Test-Path (Join-Path $installedResources 'app.asar') -PathType Leaf)) {
            throw 'NSIS installation did not produce the packaged resources directory.'
          }
          "executable=$($installed.FullName)" >> $env:GITHUB_OUTPUT
          "resources=$installedResources" >> $env:GITHUB_OUTPUT
      - name: Verify installed NSIS native artifacts
        shell: pwsh
        run: |
          node scripts/capture-desktop-release-command.mjs --stdout "$env:NEXTMUX_RELEASE_EVIDENCE/installed-terminal-verifier.stdout.log" --stderr "$env:NEXTMUX_RELEASE_EVIDENCE/installed-terminal-verifier.stderr.log" -- node scripts/verify-terminal-native-artifact.mjs --packaged "${{ steps.installed.outputs.resources }}" --output "$env:NEXTMUX_RELEASE_EVIDENCE/installed-terminal-verifier.json"
          node scripts/capture-desktop-release-command.mjs --stdout "$env:NEXTMUX_RELEASE_EVIDENCE/installed-desktop-verifier.stdout.log" --stderr "$env:NEXTMUX_RELEASE_EVIDENCE/installed-desktop-verifier.stderr.log" -- node scripts/verify-desktop-native-artifacts.mjs --packaged "${{ steps.installed.outputs.resources }}" --output "$env:NEXTMUX_RELEASE_EVIDENCE/installed-desktop-verifier.json"
      - name: Run packaged desktop product E2E from portable and installed NSIS targets
        shell: pwsh
        run: |
          $env:npm_lifecycle_event = 'test:e2e:desktop'
          $env:NEXTMUX_PACKAGED_EXECUTABLE = '${{ steps.packaged.outputs.portable }}'
          node scripts/capture-desktop-release-command.mjs --stdout "$env:NEXTMUX_RELEASE_EVIDENCE/portable-e2e.stdout.log" --stderr "$env:NEXTMUX_RELEASE_EVIDENCE/portable-e2e.stderr.log" -- node scripts/desktop-terminal-ci-e2e.mjs
          $env:NEXTMUX_PACKAGED_EXECUTABLE = '${{ steps.installed.outputs.executable }}'
          node scripts/capture-desktop-release-command.mjs --stdout "$env:NEXTMUX_RELEASE_EVIDENCE/installed-e2e.stdout.log" --stderr "$env:NEXTMUX_RELEASE_EVIDENCE/installed-e2e.stderr.log" -- node scripts/desktop-terminal-ci-e2e.mjs
      - name: Verify user data survives NSIS uninstall and replacement
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP 'nextmux-installed-${{ matrix.arch }}'
          node scripts/capture-desktop-release-command.mjs --stdout "$env:NEXTMUX_RELEASE_EVIDENCE/data-persistence.stdout.log" --stderr "$env:NEXTMUX_RELEASE_EVIDENCE/data-persistence.stderr.log" -- node scripts/desktop-install-data-persistence-e2e.mjs --platform windows --arch ${{ matrix.arch }} --install-root "$installRoot" --installer '${{ steps.packaged.outputs.installer }}' --output "$env:NEXTMUX_RELEASE_EVIDENCE/data-persistence.json"
      - name: Capture Authenticode verification logs
        shell: pwsh
        run: |
          node scripts/capture-desktop-release-command.mjs --stdout "$env:NEXTMUX_RELEASE_EVIDENCE/signing-verifier.stdout.log" --stderr "$env:NEXTMUX_RELEASE_EVIDENCE/signing-verifier.stderr.log" -- node scripts/verify-desktop-signing.mjs --release-dir apps/desktop/release --signed ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }} --output "$env:NEXTMUX_RELEASE_EVIDENCE/signing-verifier.json"
      - name: Write final Windows checksums
        run: node scripts/write-release-checksums.mjs windows-${{ matrix.arch }}
      - name: Write final runner OS, architecture, commit, and artifact SHA evidence
        if: always()
        shell: pwsh
        run: node scripts/write-desktop-release-evidence.mjs --output "$env:NEXTMUX_RELEASE_EVIDENCE/runner.json" --release-dir apps/desktop/release --platform windows --arch ${{ matrix.arch }}
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextmux-windows-${{ matrix.arch }}-evidence
          path: ${{ env.NEXTMUX_RELEASE_EVIDENCE }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: nextmux-windows-${{ matrix.arch }}
          path: |
            apps/desktop/release/NextMux-*.exe
            apps/desktop/release/NextMux-*.blockmap
            apps/desktop/release/*.yml
            apps/desktop/release/SHA256SUMS-windows-${{ matrix.arch }}.txt
          if-no-files-found: error

  macos:
    if: github.event_name == 'push' || inputs.operation == 'build'
    needs: [quality-gate, release-targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-targets.outputs.macos) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NEXTMUX_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
      NEXTMUX_RELEASE_EVIDENCE: apps/desktop/release-evidence/macos-${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Initialize runner evidence and prove the gated commit
        run: |
          mkdir -p "$NEXTMUX_RELEASE_EVIDENCE"
          test "$(git rev-parse HEAD)" = "${{ needs.quality-gate.outputs.commit }}"
          node scripts/write-desktop-release-evidence.mjs --output "$NEXTMUX_RELEASE_EVIDENCE/runner.json" --release-dir apps/desktop/release --platform macos --arch ${{ matrix.arch }}
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
      - name: Materialize App Store Connect API key
        if: env.APPLE_API_KEY_BASE64 != ''
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
      - name: Verify signed release environment
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-desktop-release-environment.mjs --platform darwin --arch ${{ matrix.arch }} --signed true --tag ${{ github.ref_name }}
      - name: Verify unsigned qualification environment
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/verify-desktop-release-environment.mjs --platform darwin --arch ${{ matrix.arch }} --signed false
      - run: pnpm install --frozen-lockfile
      - name: Run native terminal and release regressions
        run: |
          pnpm --filter @nextmux/agent-runtime test
          pnpm --filter @nextmux/theia-extension test
          pnpm --filter @nextmux/desktop test
      - name: Build production desktop application bundle
        run: pnpm desktop:build:release
      - name: Verify source native ABI, architecture, tools, keytar, and FFmpeg
        run: |
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/source-terminal-verifier.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/source-terminal-verifier.stderr.log" -- node scripts/verify-terminal-native-artifact.mjs --bundle --output "$NEXTMUX_RELEASE_EVIDENCE/source-terminal-verifier.json"
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/source-desktop-verifier.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/source-desktop-verifier.stderr.log" -- node scripts/verify-desktop-native-artifacts.mjs --output "$NEXTMUX_RELEASE_EVIDENCE/source-desktop-verifier.json"
      - name: Run real source desktop product E2E
        run: |
          export npm_lifecycle_event=test:e2e:desktop
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/source-e2e.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/source-e2e.stderr.log" -- node scripts/desktop-terminal-ci-e2e.mjs
      - name: Build native macOS artifacts without rebuilding the bundle
        run: pnpm --filter @nextmux/desktop run dist:mac:${{ matrix.arch }}:prepared
      - name: Locate packaged resources, DMG, and ZIP
        id: packaged
        run: |
          resources_path="$(find apps/desktop/release -type f -name app.asar -exec dirname {} \; -quit)"
          dmg="$(find apps/desktop/release -maxdepth 1 -type f -name 'NextMux-*.dmg' -print -quit)"
          zip="$(find apps/desktop/release -maxdepth 1 -type f -name 'NextMux-*.zip' -print -quit)"
          test -n "$resources_path"
          test -f "$dmg"
          test -f "$zip"
          echo "resources=$resources_path" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      - name: Verify final packaged native artifacts
        run: |
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/packaged-terminal-verifier.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/packaged-terminal-verifier.stderr.log" -- node scripts/verify-terminal-native-artifact.mjs --packaged "${{ steps.packaged.outputs.resources }}" --output "$NEXTMUX_RELEASE_EVIDENCE/packaged-terminal-verifier.json"
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/packaged-desktop-verifier.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/packaged-desktop-verifier.stderr.log" -- node scripts/verify-desktop-native-artifacts.mjs --packaged "${{ steps.packaged.outputs.resources }}" --output "$NEXTMUX_RELEASE_EVIDENCE/packaged-desktop-verifier.json"
      - name: Run packaged desktop product E2E from ZIP and DMG applications
        run: |
          export npm_lifecycle_event=test:e2e:desktop
          zip_root="$RUNNER_TEMP/nextmux-zip-${{ matrix.arch }}"
          rm -rf "$zip_root"
          mkdir -p "$zip_root"
          unzip -q "${{ steps.packaged.outputs.zip }}" -d "$zip_root"
          zip_executable="$(find "$zip_root" -type f -path '*/NextMux.app/Contents/MacOS/NextMux' -print -quit)"
          test -x "$zip_executable"
          zip_resources="$(dirname "$(find "$zip_root" -type f -path '*/NextMux.app/Contents/Resources/app.asar' -print -quit)")"
          test -f "$zip_resources/app.asar"
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/zip-terminal-verifier.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/zip-terminal-verifier.stderr.log" -- node scripts/verify-terminal-native-artifact.mjs --packaged "$zip_resources" --output "$NEXTMUX_RELEASE_EVIDENCE/zip-terminal-verifier.json"
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/zip-desktop-verifier.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/zip-desktop-verifier.stderr.log" -- node scripts/verify-desktop-native-artifacts.mjs --packaged "$zip_resources" --output "$NEXTMUX_RELEASE_EVIDENCE/zip-desktop-verifier.json"
          export NEXTMUX_PACKAGED_EXECUTABLE="$zip_executable"
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/zip-e2e.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/zip-e2e.stderr.log" -- node scripts/desktop-terminal-ci-e2e.mjs
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/data-persistence.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/data-persistence.stderr.log" -- node scripts/desktop-install-data-persistence-e2e.mjs --platform macos --arch ${{ matrix.arch }} --install-root "$zip_root/NextMux.app" --remove-app true --output "$NEXTMUX_RELEASE_EVIDENCE/data-persistence.json"

          mount_root="$RUNNER_TEMP/nextmux-dmg-${{ matrix.arch }}"
          mkdir -p "$mount_root"
          hdiutil attach "${{ steps.packaged.outputs.dmg }}" -nobrowse -readonly -mountpoint "$mount_root"
          trap 'hdiutil detach "$mount_root" -force >/dev/null 2>&1 || true' EXIT
          dmg_executable="$(find "$mount_root" -type f -path '*/NextMux.app/Contents/MacOS/NextMux' -print -quit)"
          test -x "$dmg_executable"
          dmg_resources="$(dirname "$(find "$mount_root" -type f -path '*/NextMux.app/Contents/Resources/app.asar' -print -quit)")"
          test -f "$dmg_resources/app.asar"
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/dmg-terminal-verifier.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/dmg-terminal-verifier.stderr.log" -- node scripts/verify-terminal-native-artifact.mjs --packaged "$dmg_resources" --output "$NEXTMUX_RELEASE_EVIDENCE/dmg-terminal-verifier.json"
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/dmg-desktop-verifier.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/dmg-desktop-verifier.stderr.log" -- node scripts/verify-desktop-native-artifacts.mjs --packaged "$dmg_resources" --output "$NEXTMUX_RELEASE_EVIDENCE/dmg-desktop-verifier.json"
          export NEXTMUX_PACKAGED_EXECUTABLE="$dmg_executable"
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/dmg-e2e.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/dmg-e2e.stderr.log" -- node scripts/desktop-terminal-ci-e2e.mjs
          hdiutil detach "$mount_root"
          trap - EXIT
      - name: Capture app and DMG signing, notarization, and staple logs
        run: |
          node scripts/capture-desktop-release-command.mjs --stdout "$NEXTMUX_RELEASE_EVIDENCE/signing-verifier.stdout.log" --stderr "$NEXTMUX_RELEASE_EVIDENCE/signing-verifier.stderr.log" -- node scripts/verify-desktop-signing.mjs --release-dir apps/desktop/release --signed ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }} --output "$NEXTMUX_RELEASE_EVIDENCE/signing-verifier.json"
      - name: Write final macOS checksums
        run: node scripts/write-release-checksums.mjs macos-${{ matrix.arch }}
      - name: Write final runner OS, architecture, commit, and artifact SHA evidence
        if: always()
        run: node scripts/write-desktop-release-evidence.mjs --output "$NEXTMUX_RELEASE_EVIDENCE/runner.json" --release-dir apps/desktop/release --platform macos --arch ${{ matrix.arch }}
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextmux-macos-${{ matrix.arch }}-evidence
          path: ${{ env.NEXTMUX_RELEASE_EVIDENCE }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: nextmux-macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.zip.blockmap
            apps/desktop/release/*.yml
            apps/desktop/release/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    environment: desktop-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          name: nextmux-windows-x64
          path: dist/nextmux-windows-x64
      - uses: actions/download-artifact@v8
        with:
          name: nextmux-windows-arm64
          path: dist/nextmux-windows-arm64
      - uses: actions/download-artifact@v8
        with:
          name: nextmux-macos-x64
          path: dist/nextmux-macos-x64
      - uses: actions/download-artifact@v8
        with:
          name: nextmux-macos-arm64
          path: dist/nextmux-macos-arm64
      - uses: actions/download-artifact@v8
        with:
          name: nextmux-windows-x64-evidence
          path: release-evidence/windows-x64
      - uses: actions/download-artifact@v8
        with:
          name: nextmux-windows-arm64-evidence
          path: release-evidence/windows-arm64
      - uses: actions/download-artifact@v8
        with:
          name: nextmux-macos-x64-evidence
          path: release-evidence/macos-x64
      - uses: actions/download-artifact@v8
        with:
          name: nextmux-macos-arm64-evidence
          path: release-evidence/macos-arm64
      - name: Run the fail-closed P10 production rollout gate
        env:
          NEXTMUX_ROLLOUT_EVIDENCE_JSON: ${{ secrets.NEXTMUX_ROLLOUT_EVIDENCE_JSON }}
          EXPECTED_RELEASE_VERSION: ${{ github.ref_name }}
          EXPECTED_RELEASE_COMMIT: ${{ github.sha }}
        run: |
          test -n "$NEXTMUX_ROLLOUT_EVIDENCE_JSON" || {
            echo 'NEXTMUX_ROLLOUT_EVIDENCE_JSON is required; refusing to publish without current production evidence.' >&2
            exit 1
          }
          umask 077
          printf '%s' "$NEXTMUX_ROLLOUT_EVIDENCE_JSON" > rollout-evidence.json
          node scripts/p10-rollout-gate.mjs --input rollout-evidence.json
          rm -f rollout-evidence.json
      - name: Verify the complete signed four-target distribution set
        run: node scripts/promote-desktop-updates.mjs release --tag "$GITHUB_REF_NAME" --dist dist --evidence release-evidence --dry-run
      - name: Archive architecture-scoped update manifests for the immutable release
        id: channel
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* ]]; then
            channel="${version#*-}"
            channel="${channel%%.*}"
          else
            channel=latest
          fi
          echo "name=$channel" >> "$GITHUB_OUTPUT"
          cp "dist/nextmux-windows-x64/$channel.yml" dist/release-manifest-windows-x64.yml
          cp "dist/nextmux-windows-arm64/$channel.yml" dist/release-manifest-windows-arm64.yml
          cp "dist/nextmux-macos-x64/$channel-mac.yml" dist/release-manifest-macos-x64.yml
          cp "dist/nextmux-macos-arm64/$channel-mac.yml" dist/release-manifest-macos-arm64.yml
      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel="${{ steps.channel.outputs.name }}"
          mapfile -d '' files < <(find dist -type f \
            ! -name 'builder*.yml' \
            ! -name "$channel.yml" \
            ! -name "$channel-mac.yml" \
            -print0)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "NextMux $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
      - name: Promote signed architecture-scoped update feeds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/promote-desktop-updates.mjs release --tag "$GITHUB_REF_NAME" --dist dist --evidence release-evidence

  rollback:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'rollback'
    runs-on: ubuntu-24.04
    environment: desktop-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Validate rollback target
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$ROLLBACK_TAG"
          case "$ROLLBACK_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "rollback_tag must be an existing vX.Y.Z tag" >&2; exit 1 ;;
          esac
          gh release view "$ROLLBACK_TAG" >/dev/null
      - name: Restore the archived signed feed and artifacts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: node scripts/promote-desktop-updates.mjs rollback --tag "$ROLLBACK_TAG"
      # Installed apps follow the release target set in the admin console (Releases), not this storage feed.
      # Restoring the feed alone does not move them, so the run says so instead of reporting a finished rollback.
      - name: Rollback still needs the release target
        env:
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          {
            echo "### Storage restored for $ROLLBACK_TAG"
            echo ""
            echo "Installed apps update from the release target, which this job does not change."
            echo "To finish the rollback, open Admin → Releases and select $ROLLBACK_TAG for every platform (with the versions to downgrade from)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Rollback not finished::Select $ROLLBACK_TAG as the release target in Admin → Releases to move installed apps."
